plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven { url = "https://cursemaven.com" }
    exclusiveContent {
        forRepository { maven { url = "https://maven.latvian.dev/releases" } }
        filter { includeGroup 'dev.latvian.mods' }
    }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = "https://maven.blamejared.com/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        evaluate_tests {
            sourceSet(sourceSets.test)
        }
    }
}

neoForge.runs.configureEach {
    loadedMods = [neoForge.mods.evaluate]
}
neoForge.runs.gameTestServer {
    loadedMods = [neoForge.mods.evaluate, neoForge.mods.evaluate_tests]
    sourceSet = sourceSets.test
    gameDirectory = layout.buildDirectory.dir('gametest')
    systemProperty 'neoforge.enabledGameTestNamespaces', 'evaluate_tests'
    programArguments.addAll '--tests', 'evaluate_tests:*', '--report', layout.buildDirectory.file('reports/gametest.xml').get().asFile.absolutePath
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:saturn-lib-1767455:9606807"

    compileOnly "dev.latvian.mods:kubejs-neoforge:$kubejs_version"
    if (providers.gradleProperty('testKubeJS').map { it.toBoolean() }.getOrElse(false)) {
        // KubeJS bundles its web libraries in jarjar; load its external runtime mods explicitly.
        localRuntime("dev.latvian.mods:kubejs-neoforge:$kubejs_version") { transitive = false }
        localRuntime "dev.latvian.mods:rhino:2101.2.8-build.91"
        localRuntime("dev.latvian.mods:better-advanced-tooltips:2601.1.0-build.9") { transitive = false }
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // FTB Quests
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"

    if (!providers.gradleProperty('testWithoutFTBQuests').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

if (providers.gradleProperty('testKubeJS').map { it.toBoolean() }.getOrElse(false)) {
    def prepareKubeJSTest = tasks.register('prepareKubeJSTest', Copy) {
        from 'src/kubejsTest'
        into layout.buildDirectory.dir('gametest')
    }
    tasks.named('runGameTestServer') { dependsOn prepareKubeJSTest }
}

def prepareFtbQuestsTest = tasks.register('prepareFtbQuestsTest', Copy) {
    from 'src/ftbquestsTest'
    into layout.buildDirectory.dir('gametest')
    // FTB writes its edited live book on shutdown, so restore the baseline before every run.
    outputs.upToDateWhen { false }
}
tasks.named('runGameTestServer') { dependsOn prepareFtbQuestsTest }

tasks.named('jar', Jar) {
    includeEmptyDirs = false
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
